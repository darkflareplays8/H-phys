<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Circle Battle Sim - p5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

<style>
html, body {
  margin: 0;
  background: #000;
  overflow: hidden;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#ui {
  position: fixed;
  top: clamp(6px, 1.2vw, 16px);
  left: clamp(6px, 1.2vw, 16px);
  color: #fff;
  font-size: clamp(11px, 1.2vw, 16px);
  z-index: 10;
  display: flex;
  gap: clamp(4px, 0.8vw, 10px);
  flex-wrap: wrap;
  max-width: calc(100vw - 130px);
}

button {
  background: #222;
  color: #fff;
  border: clamp(1px, 0.12vw, 2px) solid #555;
  border-radius: clamp(4px, 0.5vw, 8px);
  padding: clamp(4px, 0.6vw, 9px) clamp(8px, 1vw, 16px);
  font-size: clamp(11px, 1.1vw, 15px);
  cursor: pointer;
}

button:hover {
  background: #333;
}

#status {
  position: fixed;
  top: clamp(6px, 1.2vw, 16px);
  right: clamp(6px, 1.2vw, 16px);
  color: #fff;
  font-size: clamp(10px, 1.1vw, 15px);
  text-align: right;
  z-index: 10;
}

#title {
  position: fixed;
  top: clamp(6%, 8vh, 10%);
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: clamp(15px, 2.2vw, 30px);
  font-weight: bold;
  letter-spacing: clamp(1px, 0.3vw, 4px);
  z-index: 9;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>

<body>
<div id="ui">
  <button onclick="resetSim()">Restart</button>
  <button onclick="toggleSpeed()">Speed: <span id="speedLabel">1x</span></button>
</div>

<div id="status"></div>
<div id="title">PART 2</div>

<script>
let center;
let radius;
let heads = [];
let particles = [];
let headIdCounter = 0;
let speedMult = 1;
let BALL_R;
let BASE_SPEED;

const PALETTE = [
  '#ff5fc4',
  '#ffb347',
  '#e0c341',
  '#ffe45f',
  '#4d63ff',
  '#e8d54a'
];

const SHAPES = [
  'circle',
  'triangle',
  'square',
  'diamond',
  'star',
  'plus'
];

const INITIAL_RAYS = 12;
const RAYS_PER_BOUNCE = 1;
const LOCAL_ARC_SPREAD = Math.PI * 0.62;
const WALL_SPEEDUP = 1.05;

function toggleSpeed() {
  speedMult = speedMult === 1 ? 2 : speedMult === 2 ? 0.5 : 1;
  document.getElementById('speedLabel').textContent = speedMult + 'x';
}

function computeScale() {
  const viewSize = Math.min(width, height);

  BALL_R = constrain(viewSize * 0.021, 8, 28);
  BASE_SPEED = constrain(viewSize * 0.0038, 1.8, 5.5);
}

function pointOnCircle(angle) {
  return {
    x: center.x + Math.cos(angle) * radius,
    y: center.y + Math.sin(angle) * radius
  };
}

class Head {
  constructor(id, angle) {
    this.id = id;
    this.color = PALETTE[id % PALETTE.length];
    this.shape = SHAPES[id % SHAPES.length];

    this.pos = {
      x: center.x + Math.cos(angle) * (radius - BALL_R),
      y: center.y + Math.sin(angle) * (radius - BALL_R)
    };

    const inward = angle + Math.PI;
    const jitter = (Math.random() - 0.5) * 0.5;

    this.vel = {
      x: Math.cos(inward + jitter) * BASE_SPEED,
      y: Math.sin(inward + jitter) * BASE_SPEED
    };

    this.rays = [];
    this.spawnRayBatch(angle, INITIAL_RAYS);
    this.alive = true;
  }

  spawnRayBatch(wallAngle, count) {
    for (let i = 0; i < count; i++) {
      const angle = wallAngle + (Math.random() - 0.5) * LOCAL_ARC_SPREAD;

      this.rays.push({
        endpoint: pointOnCircle(angle),
        alive: true
      });
    }
  }

  aliveRayCount() {
    return this.rays.filter(ray => ray.alive).length;
  }

  rayEndpoints() {
    return this.rays
      .filter(ray => ray.alive)
      .map(ray => ({
        start: this.pos,
        end: ray.endpoint,
        ref: ray
      }));
  }

  draw() {
    if (!this.alive) return;

    for (const segment of this.rayEndpoints()) {
      push();

      const rayColor = color(this.color);
      rayColor.setAlpha(165);

      stroke(rayColor);
      strokeWeight(constrain(BALL_R * 0.075, 0.7, 1.8));

      line(
        segment.start.x,
        segment.start.y,
        segment.end.x,
        segment.end.y
      );

      pop();
    }

    drawShape(
      this.pos.x,
      this.pos.y,
      BALL_R,
      this.shape,
      this.color
    );
  }
}

function drawShape(x, y, size, shape, col) {
  push();

  translate(x, y);

  noStroke();
  fill(col);
  circle(0, 0, size * 2);

  stroke('#000');
  strokeWeight(constrain(size * 0.09, 1, 2.5));
  noFill();
  circle(0, 0, size * 2);

  const inner = size * 0.55;

  noStroke();
  fill('#000');

  if (shape === 'circle') {
    circle(0, 0, inner * 2);
  }

  if (shape === 'square') {
    beginShape();
    vertex(-inner, -inner);
    vertex(inner, -inner);
    vertex(inner, inner);
    vertex(-inner, inner);
    endShape(CLOSE);
  }

  if (shape === 'triangle') {
    beginShape();
    vertex(0, -inner);
    vertex(inner, inner);
    vertex(-inner, inner);
    endShape(CLOSE);
  }

  if (shape === 'diamond') {
    beginShape();
    vertex(0, -inner);
    vertex(inner, 0);
    vertex(0, inner);
    vertex(-inner, 0);
    endShape(CLOSE);
  }

  if (shape === 'star') {
    const spikes = 5;
    const outerRadius = inner;
    const innerRadius = inner * 0.45;
    const step = Math.PI / spikes;
    let rotation = -Math.PI / 2;

    beginShape();

    for (let i = 0; i < spikes * 2; i++) {
      const currentRadius = i % 2 === 0
        ? outerRadius
        : innerRadius;

      vertex(
        Math.cos(rotation) * currentRadius,
        Math.sin(rotation) * currentRadius
      );

      rotation += step;
    }

    endShape(CLOSE);
  }

  if (shape === 'plus') {
    const thickness = inner * 0.4;

    beginShape();
    vertex(-thickness, -inner);
    vertex(thickness, -inner);
    vertex(thickness, -thickness);
    vertex(inner, -thickness);
    vertex(inner, thickness);
    vertex(thickness, thickness);
    vertex(thickness, inner);
    vertex(-thickness, inner);
    vertex(-thickness, thickness);
    vertex(-inner, thickness);
    vertex(-inner, -thickness);
    vertex(-thickness, -thickness);
    endShape(CLOSE);
  }

  pop();
}

function pointSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const lengthSquared = dx * dx + dy * dy;

  let t = lengthSquared > 0
    ? ((px - ax) * dx + (py - ay) * dy) / lengthSquared
    : 0;

  t = Math.max(0, Math.min(1, t));

  const closestX = ax + t * dx;
  const closestY = ay + t * dy;

  return {
    dist: Math.hypot(px - closestX, py - closestY),
    x: closestX,
    y: closestY
  };
}

function resetSim() {
  heads = [];
  particles = [];
  headIdCounter = 0;

  const count = 6;

  for (let i = 0; i < count; i++) {
    heads.push(
      new Head(
        headIdCounter++,
        Math.PI * 2 / count * i - Math.PI / 2
      )
    );
  }
}

function spawnBurst(point, col) {
  for (let i = 0; i < 6; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 1.5 + 0.3;

    particles.push({
      x: point.x,
      y: point.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 60 + Math.random() * 40,
      maxLife: 100,
      color: col,
      r: BALL_R * (Math.random() * 0.12 + 0.06)
    });
  }
}

function updatePhysics() {
  for (const head of heads) {
    if (!head.alive) continue;

    head.pos.x += head.vel.x * speedMult;
    head.pos.y += head.vel.y * speedMult;

    const dx = head.pos.x - center.x;
    const dy = head.pos.y - center.y;
    const distance = Math.hypot(dx, dy);

    if (distance + BALL_R > radius) {
      const normalX = dx / distance;
      const normalY = dy / distance;
      const velocityDot = head.vel.x * normalX + head.vel.y * normalY;

      head.vel.x -= 2 * velocityDot * normalX;
      head.vel.y -= 2 * velocityDot * normalY;

      head.vel.x *= WALL_SPEEDUP;
      head.vel.y *= WALL_SPEEDUP;

      const overlap = distance + BALL_R - radius;

      head.pos.x -= normalX * overlap;
      head.pos.y -= normalY * overlap;

      const touchAngle = Math.atan2(normalY, normalX);

      head.spawnRayBatch(touchAngle, RAYS_PER_BOUNCE);
    }
  }

  for (let i = 0; i < heads.length; i++) {
    for (let j = i + 1; j < heads.length; j++) {
      const first = heads[i];
      const second = heads[j];

      if (!first.alive || !second.alive) continue;

      const dx = second.pos.x - first.pos.x;
      const dy = second.pos.y - first.pos.y;
      const distance = Math.hypot(dx, dy);

      if (distance < BALL_R * 2 && distance > 0.001) {
        const normalX = dx / distance;
        const normalY = dy / distance;
        const overlap = BALL_R * 2 - distance;

        first.pos.x -= normalX * overlap / 2;
        first.pos.y -= normalY * overlap / 2;

        second.pos.x += normalX * overlap / 2;
        second.pos.y += normalY * overlap / 2;

        const firstVelocity = first.vel.x * normalX + first.vel.y * normalY;
        const secondVelocity = second.vel.x * normalX + second.vel.y * normalY;

        first.vel.x += (secondVelocity - firstVelocity) * normalX;
        first.vel.y += (secondVelocity - firstVelocity) * normalY;

        second.vel.x += (firstVelocity - secondVelocity) * normalX;
        second.vel.y += (firstVelocity - secondVelocity) * normalY;

        first.vel.x *= WALL_SPEEDUP;
        first.vel.y *= WALL_SPEEDUP;

        second.vel.x *= WALL_SPEEDUP;
        second.vel.y *= WALL_SPEEDUP;
      }
    }
  }
}

function checkRayCollisions() {
  for (const head of heads) {
    if (!head.alive) continue;

    for (const other of heads) {
      if (other === head || !other.alive) continue;

      for (const segment of head.rayEndpoints()) {
        if (!segment.ref.alive) continue;

        const hit = pointSegDist(
          other.pos.x,
          other.pos.y,
          segment.start.x,
          segment.start.y,
          segment.end.x,
          segment.end.y
        );

        if (hit.dist < BALL_R) {
          segment.ref.alive = false;
          spawnBurst(
            {
              x: hit.x,
              y: hit.y
            },
            head.color
          );
        }
      }
    }
  }
}

function checkDeaths() {
  for (const head of heads) {
    if (head.alive && head.aliveRayCount() === 0) {
      head.alive = false;
      spawnBurst(head.pos, head.color);
    }
  }
}

function updateParticles() {
  for (const particle of particles) {
    particle.x += particle.vx * speedMult;
    particle.y += particle.vy * speedMult;

    particle.vx *= 0.98;
    particle.vy *= 0.98;
    particle.life -= speedMult;
  }

  particles = particles.filter(particle => particle.life > 0);
}

function drawParticles() {
  noStroke();

  for (const particle of particles) {
    const particleColor = color(particle.color);
    particleColor.setAlpha(
      Math.max(0, particle.life / particle.maxLife) * 204
    );

    fill(particleColor);
    circle(
      particle.x,
      particle.y,
      particle.r * 2
    );
  }
}

function drawArena() {
  noFill();
  stroke(255, 255, 255, 153);
  strokeWeight(constrain(radius * 0.012, 3, 7));
  circle(center.x, center.y, radius * 2);
}

function updateStatus() {
  const aliveHeads = heads.filter(head => head.alive);
  const statusElement = document.getElementById('status');

  if (aliveHeads.length === 1) {
    statusElement.innerHTML =
      `<b style="color:${aliveHeads[0].color}">Winner!</b>`;
    return;
  }

  if (aliveHeads.length === 0) {
    statusElement.innerHTML = 'Draw';
    return;
  }

  let text = `${aliveHeads.length} alive<br>`;

  for (const head of aliveHeads) {
    text +=
      `<span style="color:${head.color}">●</span> ` +
      `${head.aliveRayCount()}&nbsp;&nbsp;`;
  }

  statusElement.innerHTML = text;
}

function computeArena() {
  center = {
    x: width / 2,
    y: height / 2
  };

  radius = Math.min(width, height) * 0.44;

  computeScale();
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  computeArena();
  resetSim();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  computeArena();
}

function draw() {
  noStroke();
  fill(0, 0, 0, 71);
  rect(0, 0, width, height);

  drawArena();
  updatePhysics();
  checkRayCollisions();
  checkDeaths();
  updateParticles();
  drawParticles();

  for (const head of heads) {
    head.draw();
  }

  updateStatus();
}
</script>
</body>
</html>
